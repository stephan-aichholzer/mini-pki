# mini-pki settings, sourced by the scripts via lib/ca-key.sh.
# Every value can also be overridden from the environment, e.g.
#   CA_BACKEND=card ./create-server-cert.sh server.example.com

# Where the CA private key lives:
#   file - private/ca-key.pem, passphrase protected (original behaviour)
#   card - on a PKCS#11 smartcard/token (e.g. Thales IDPrime 940), never leaves it
CA_BACKEND=${CA_BACKEND:-file}

# --- card backend only ---------------------------------------------------
# Vendor PKCS#11 module that talks to the card (SafeNet Authentication Client)
PKCS11_MODULE=${PKCS11_MODULE:-/usr/lib/libeTPkcs11.so}

# Directory holding the OpenSSL pkcs11 provider (pkcs11.so). Leave empty to
# use card-tools/pkcs11-provider/ (built by card-tools/build-pkcs11-provider.sh)
# or, if that does not exist, the system provider (apt install pkcs11-provider).
PKCS11_PROVIDER_DIR=${PKCS11_PROVIDER_DIR:-}

# Token label (empty = the only token present) and the CA key on it
CARD_TOKEN=${CARD_TOKEN:-}
CARD_KEY_LABEL=${CARD_KEY_LABEL:-mini-pki-ca}
CARD_KEY_ID=${CARD_KEY_ID:-01}
# rsa:2048, rsa:4096 or EC:prime256v1 - what a standard IDPrime 940 generates
# (P-384/P-521 and RSA-3072 need a custom card configuration)
CARD_KEY_TYPE=${CARD_KEY_TYPE:-rsa:4096}

# Card PIN. Leave unset to be prompted. Setting it here is only acceptable
# for training cards.
#CARD_PIN=
